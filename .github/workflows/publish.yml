name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OpenID Connect) — no API tokens.
# Configure the trusted publisher on PyPI with:
#   Project: goalkit | Owner: Nom-nom-hub | Repo: goal-kit
#   Workflow: publish.yml | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1