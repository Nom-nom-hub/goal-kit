[project]
name = "goalkit"
version = "2.3.1"
license = "MIT"
description = "Goalkit CLI - Goal-Driven Development tool for AI agents"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
goalkit = "goalkit:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["goalkit", "goalkit.commands"]

[tool.setuptools.package-dir]
"" = "src"