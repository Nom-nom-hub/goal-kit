site_name: Goal Kit
site_description: Goal-Driven Development Toolkit for AI Agents
site_author: Nom-nom-hub
repo_url: https://github.com/Nom-nom-hub/goal-kit
edit_uri: edit/main/docs/
docs_dir: '.'
site_dir: '../site'

theme:
  name: material
  palette:
    primary: green
    accent: green
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Goal-Driven Development: goal-driven.md
  - Workflow Guide: workflow-guide.md
  - Program Guide: program-guide.md
  - Portfolio Management: portfolio-management.md
  - OKR Guide: okr-guide.md
  - Alignment Guide: alignment-guide.md
  - Analytics Guide: analytics-guide.md
  - Webhooks Guide: webhooks-guide.md
  - Common Mistakes: common-mistakes.md
  - Commands:
    - Execute: execute-command.md
    - Goal: goal-command.md
    - Help: help-command.md
    - Methodology: methodology-command.md
    - Metrics: metrics-command.md
    - Milestones: milestones-command.md
    - Reflect: reflect-command.md
    - Strategies: strategies-command.md
    - Vision: vision-command.md
  - Reference:
    - Quick Reference: quick-reference.md
    - Comparison: comparison.md
    - Examples: examples.md
    - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
